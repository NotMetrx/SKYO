<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SKYO</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#03040b;--gl:rgba(10,14,32,.76);--ln:#26304f;--fg:#eef3ff;--mut:#93a0c4;--ac:#5bb8ff;--ac2:#ff7a1a;box-sizing:border-box}
*{box-sizing:border-box}html,body{height:100%}html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font:400 14px/1.5 Poppins,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.top{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:linear-gradient(#03040bd0,transparent)}
.brand{color:var(--fg);text-decoration:none;font-weight:300;letter-spacing:.38em;font-size:18px}.brand i{font-style:normal;color:var(--ac)}
nav{display:flex;gap:4px;background:var(--gl);border:1px solid var(--ln);border-radius:14px;padding:4px;backdrop-filter:blur(10px)}
nav a{display:flex;align-items:center;gap:8px;color:var(--mut);text-decoration:none;padding:8px 14px;border-radius:10px;border:1px solid transparent;font-weight:600;font-size:13px}
nav a[aria-current=page]{color:var(--ac);background:#5bb8ff1f;border-color:#5bb8ff55}
.sec{position:fixed;inset:0;display:none}.sec.on{display:block}
canvas.f{position:absolute;inset:0;width:100%;height:100%;display:block}
#inicio.on{display:grid;place-items:center;text-align:center}
.hero{position:relative;z-index:2;padding:0 16px}
.logo{width:min(900px,92vw);height:auto;display:block;margin:auto;mix-blend-mode:screen;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.hero p{margin:6px auto 22px;color:var(--mut);max-width:46ch;font-weight:300;font-size:clamp(14px,2.6vw,18px)}
.cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{border:1px solid var(--ln);background:var(--gl);border-radius:999px;padding:10px 20px;font-weight:600;font-size:13px;text-decoration:none;color:var(--fg);display:inline-block}
.btn.pr{background:var(--ac);border-color:var(--ac);color:#031018}
#load{position:fixed;inset:0;z-index:100;background:#02030a;display:grid;place-content:center;justify-items:center;gap:16px;transition:opacity .8s}
#load.out{opacity:0;pointer-events:none}
#sub{margin:0;font-weight:300;letter-spacing:.22em;text-transform:uppercase;font-size:clamp(11px,2.4vw,15px);color:var(--mut);text-align:center;padding:0 16px;animation:fi 1.4s both .4s}
.bar{width:150px;height:2px;background:var(--ln);overflow:hidden}.bar::after{content:"";display:block;height:100%;width:40%;background:var(--ac);animation:sl 1.1s infinite}
@keyframes fi{from{opacity:0;transform:translateY(6px)}}@keyframes sl{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
.flt{position:absolute;z-index:5;top:calc(66px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;gap:2px;background:var(--gl);border:1px solid var(--ln);border-radius:999px;padding:3px;backdrop-filter:blur(8px)}
.flt button{border:0;background:none;color:var(--mut);padding:6px 13px;border-radius:999px;font-weight:600;font-size:12px}.flt .on{background:var(--ac);color:#031018}
.hint{position:absolute;z-index:4;bottom:22px;left:0;right:0;text-align:center;color:var(--mut);font-size:12px;pointer-events:none}
#info{position:absolute;z-index:6;left:18px;bottom:18px;width:290px;background:var(--gl);border:1px solid var(--ln);border-radius:14px;padding:10px;backdrop-filter:blur(10px)}
#info[hidden]{display:none}#ith{width:100%;height:130px;border-radius:9px;display:block}
.tg{display:inline-block;margin:8px 0 2px;font-size:10px;padding:2px 8px;border-radius:5px;background:var(--ln);color:var(--mut)}
#info h3{margin:0;font-size:17px}#info p{margin:4px 0;font-size:12px;color:var(--mut)}
#info .r{display:flex;gap:6px;margin-top:8px}#info .btn{flex:1;border-radius:8px;padding:7px;font-size:11px;text-align:center}
#c3d{position:absolute;inset:0}#c3d canvas{display:block;touch-action:none}.err{text-align:center;margin-top:30vh;color:var(--mut)}
.ctl{position:absolute;z-index:5;bottom:18px;left:50%;transform:translateX(-50%);width:min(560px,94vw);background:var(--gl);border:1px solid var(--ln);border-radius:14px;padding:10px 12px;backdrop-filter:blur(10px)}
.ctl .r{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.ctl button{border:1px solid var(--ln);background:none;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--mut)}
.ctl button.on{background:#5bb8ff22;border-color:#5bb8ff77;color:var(--ac)}.ctl p{margin:6px 0 0;font-size:12px;color:var(--mut)}input[type=range]{accent-color:#5bb8ff;width:90px}
#hera{position:fixed;z-index:40;right:18px;bottom:18px}
#ha{display:block;border:0;background:none;padding:0}
#ha img{width:96px;height:auto;display:block;animation:fl 5s ease-in-out infinite;filter:drop-shadow(0 6px 18px #5bb8ff66)}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}
#hb{position:absolute;right:0;bottom:100%;width:min(290px,80vw);margin-bottom:8px;background:var(--gl);border:1px solid var(--ln);border-radius:14px 14px 4px 14px;padding:12px;backdrop-filter:blur(10px);opacity:0;transform:translateY(6px);pointer-events:none;transition:.25s}
#hb.show{opacity:1;transform:none;pointer-events:auto}
#hb b{font-size:11px;color:var(--ac2);letter-spacing:.08em}#ht{margin:4px 0 8px;font-size:13px}
#hc{display:flex;flex-wrap:wrap;gap:5px}#hc button{border:1px solid var(--ln);background:none;border-radius:999px;padding:4px 10px;font-size:11px;color:var(--mut)}
@media(max-width:720px){
nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));justify-content:space-around;border-radius:16px}
nav a{flex-direction:column;gap:1px;font-size:10px;padding:7px 4px;flex:1;text-align:center}nav a b{font-size:17px;line-height:1.2}
#hera{right:6px;bottom:auto;top:calc(54px + env(safe-area-inset-top,0px))}#ha img{width:62px}
#hb{bottom:auto;top:100%;margin:6px 0 0;border-radius:4px 14px 14px 14px}
.flt{left:10px;transform:none;top:calc(58px + env(safe-area-inset-top,0px))}.flt button{padding:5px 9px;font-size:11px}
#info{left:10px;right:10px;width:auto;bottom:calc(84px + env(safe-area-inset-bottom,0px))}#ith{height:90px}
.ctl{bottom:calc(84px + env(safe-area-inset-bottom,0px))}.hint{bottom:calc(92px + env(safe-area-inset-bottom,0px))}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
