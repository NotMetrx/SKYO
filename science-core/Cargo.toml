[package]
name = "skyo_wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Kernel numerico local de comparacion SPHEREx para SKYO"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
